<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Post</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <a href="index.html">← Kembali</a>
</header>

<main id="post-detail">Loading...</main>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyba6jtWxz-vWkOSR6l7Tj1p1wQx8cfkiz6HzBbd8BFtSiWj5InCP2MBnBpfW9_I9A/exec";

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

function renderVideo(url) {
  if (!url) return "";

  return `
    <div class="video-container">
      <iframe 
        src="${url}" 
        allow="autoplay"
        sandbox="allow-scripts allow-same-origin"
        referrerpolicy="no-referrer"
        allowfullscreen>
      </iframe>
    </div>
  `;
}

fetch(API_URL)
  .then(res => res.json())
  .then(data => {
    const post = data.find(p => p.id == id);

    if (!post) {
      document.getElementById("post-detail").innerHTML = "Post tidak ditemukan";
      return;
    }

    document.getElementById("post-detail").innerHTML = `
      <h1>${post.judul}</h1>
      <p class="date">${post.tanggal}</p>

      ${renderVideo(post.video_embed)}

      <p>${post.isi}</p>

      <a href="${post.link}" target="_blank">🔗 Sumber</a>
    `;
  })
  .catch(err => {
    document.getElementById("post-detail").innerHTML = "Gagal load data";
    console.error(err);
  });
</script>

</body>
</html>
