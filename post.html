<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Post</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <a href="index.html">← Kembali</a>
</header>

<main id="post-detail">
  <p>Loading...</p>
</main>

<script>
const API_URL = "PASTE_URL_APPS_SCRIPT_KAMU";

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

function getEmbedVideo(url) {
  if (!url) return "";

  // YouTube
  if (url.includes("youtube.com") || url.includes("youtu.be")) {
    let videoId = "";

    if (url.includes("watch?v=")) {
      videoId = url.split("watch?v=")[1];
    } else if (url.includes("youtu.be/")) {
      videoId = url.split("youtu.be/")[1];
    }

    return `
      <iframe 
        src="https://www.youtube.com/embed/${videoId}"
        frameborder="0"
        allowfullscreen>
      </iframe>
    `;
  }

  // Jumpshare (fallback)
  if (url.includes("jumpshare.com")) {
    return `
      <div class="video-fallback">
        <p>🎥 Video tersedia:</p>
        <a href="${url}" target="_blank">Tonton video</a>
      </div>
    `;
  }

  // Default iframe
  return `
    <iframe src="${url}" frameborder="0"></iframe>
  `;
}

fetch(API_URL)
  .then(res => res.json())
  .then(data => {
    const post = data.find(p => p.id == id);

    if (!post) {
      document.getElementById("post-detail").innerHTML = "<p>Post tidak ditemukan</p>";
      return;
    }

    const videoHTML = getEmbedVideo(post.video);

    document.getElementById("post-detail").innerHTML = `
      <h1>${post.judul}</h1>
      <p class="date">${post.tanggal}</p>

      ${videoHTML}

      <p>${post.isi}</p>

      <a href="${post.link}" target="_blank">🔗 Sumber</a>
    `;
  })
  .catch(err => {
    document.getElementById("post-detail").innerHTML = "<p>Gagal load data</p>";
  });
</script>

</body>
</html>
